name: Timing Probe

on:
  workflow_dispatch:
  push:
    branches:
      - psx-dualshock-experiment

permissions:
  contents: read

env:
  QUARTUS_IMAGE: docker.io/chriz2600/quartus-lite@sha256:50eac410e54617e93ad6c13d9129f7e52c89108a819ded31e66d1eb4577cd8ef
  QUARTUS_IN_IMAGE: /opt/intelFPGA_lite/23.1/quartus/bin

jobs:
  timing:
    concurrency:
      group: timing-probe-${{ github.ref }}-${{ matrix.seed }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        seed: [41, 13, 20]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Quartus
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker pull -q "$QUARTUS_IMAGE"
          mkdir -p "$RUNNER_TEMP/quartus"
          cat > "$RUNNER_TEMP/quartus/quartus_sh" <<'SH'
          #!/bin/sh
          exec docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$QUARTUS_IMAGE" "$QUARTUS_IN_IMAGE/quartus_sh" "$@"
          SH
          cat > "$RUNNER_TEMP/quartus/quartus_sta" <<'SH'
          #!/bin/sh
          exec docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$QUARTUS_IMAGE" "$QUARTUS_IN_IMAGE/quartus_sta" "$@"
          SH
          chmod +x "$RUNNER_TEMP/quartus/quartus_sh" "$RUNNER_TEMP/quartus/quartus_sta"
          echo "QUARTUS_BIN=$RUNNER_TEMP/quartus" >> "$GITHUB_ENV"

      - name: Generate RTL initialization includes
        run: |
          python3 tools/mips_inits.py
          python3 sim/rsp/make_div_rom.py rtl/rsp/rsp_div_rom.hex

      - name: Compile FPGA and check timing
        id: fit
        run: |
          WAIT=1 tools/area2/fit.sh probe "${{ matrix.seed }}"
          tools/fits.py verify projects_a2_probe

      - name: Detailed timing paths
        if: always() && hashFiles('projects_a2_probe/output_files/mirlo.sta.summary') != ''
        run: |
          sed 's/projects_a2_nightly/projects_a2_probe/g' tools/area2/report_timing.tcl > "$GITHUB_WORKSPACE/report_probe.tcl"
          "$QUARTUS_BIN/quartus_sta" -t "$GITHUB_WORKSPACE/report_probe.tcl" > projects_a2_probe_timing.log 2>&1
          rm -f "$GITHUB_WORKSPACE/report_probe.tcl"

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-probe-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: |
            projects_a2_probe.compile.log
            projects_a2_probe/output_files/*.summary
            projects_a2_probe/output_files/*.rpt
            projects_a2_probe_timing.log
          retention-days: 14
          if-no-files-found: ignore
